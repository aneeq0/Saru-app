# Railway project settings for the NestJS API.
# In the Railway UI: set Root Directory to `backend` (this folder).
# Required vars on this service: DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# Optional: REDIS_URL, WEB_ORIGIN, SESSION_COOKIE_*

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrate + seed + start in one command so a failed pre-deploy cannot leave an empty DB.
startCommand = "sh scripts/start-railway.sh"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
