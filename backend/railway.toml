# Railway project settings for the NestJS API.
# In the Railway UI: set Root Directory to `backend` (this folder).
# Required vars on this service: DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# Optional: REDIS_URL, WEB_ORIGIN, SESSION_COOKIE_*

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run migrations before traffic switches to the new replica (avoids healthcheck race).
preDeployCommand = ["pnpm", "run", "prisma:deploy"]
startCommand = "node apps/api/dist/main.js"
# Give the process time to boot after image start.
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
